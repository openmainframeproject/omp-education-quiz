# Create before deploying:  kubectl apply -f k8s/01-secret.example.yaml
# after replacing the placeholder values (or use your secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: moe-secrets
  namespace: moe
type: Opaque
stringData:
  SESSION_SECRET: "replace-with-long-random-string"
  ADMIN_SECRET: "replace-with-another-random-string"
  DATABASE_URL: "postgres://moe:moe@your-postgres-host:5432/moe"
