# Fly.io machine config
# Setup:   fly launch --no-deploy --copy-config
# Postgres: fly postgres create --name moe-pg && fly postgres attach moe-pg
#           (attach injects DATABASE_URL as a secret automatically)
# Secrets: fly secrets set SESSION_SECRET=... ADMIN_SECRET=...
# Deploy:  fly deploy

app = "mainframe-open-education"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
